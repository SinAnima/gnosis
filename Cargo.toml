[package]
name = "gnosis"
version = "0.7.1"
edition = "2021"
license = "MIT"
authors = ["Thanos Vassilakis"]
repository = "https://github.com/SinAnima/gnosis"
homepage = "https://github.com/SinAnima/gnosis"
documentation = "https://docs.rs/gnosis"
rust-version = "1.85"
description = "Compile a project folder, S3 bucket, or documentation site into a structured inventory of code, documents, and data"
readme = "README.md"
keywords = ["knowledge", "compiler", "okf", "tree-sitter", "tui"]
categories = ["command-line-utilities", "development-tools"]
default-run = "gnosis"
# crates.io rejects uploads over 10 MiB. These demo binaries stay in git
# for local scans and are omitted from the published crate.
exclude = [
    "fixtures/mixed-repo/docs/*.pdf",
    "fixtures/mixed-repo/docs/*.png",
]

[lib]
name = "gnosis"
path = "src/lib.rs"

[[bin]]
name = "gnosis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# Omit aws-sdk-s3's default `rustls` feature — it enables legacy rustls 0.21
# (RUSTSEC-2026-0098/0099/0104). Modern TLS comes from `default-https-client`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "native-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
base64 = { version = "0.23.0", optional = true }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
csv = "1"
exif = { package = "kamadak-exif", version = "0.6" }
genai = { version = "0.5.3", optional = true }
ignore = "0.4"
mime_guess = "2"
notify = "6.1"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
scraper = "0.27"
spider = { version = "2.53", optional = true, default-features = false, features = ["sync", "headers", "rate_limit", "reqwest_rustls_tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
toml = "1.1"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-rust = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
png = "0.18.1"
image-webp = "0.2.4"
psd = "0.3.5"
avif-parse = "2.1"
nom-exif = "3.8"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
flate2 = "1.1.10"

[dev-dependencies]
assert_cmd = "2"
crossbeam-channel = "0.5"
predicates = "3"
tempfile = "3"

[features]
default = ["web"]
# Optional multi-provider LLM semantic extraction (`genai` + prompt packs).
llm = ["dep:genai", "dep:base64"]
# HTTP(S) crawl. On by default so `gnosis scan https://…` works in a normal build.
web = ["dep:spider"]

[package]
name = "gnosis"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Thanos Vassilakis"]
repository = "https://github.com/thanos/gnosis"
homepage = "https://github.com/thanos/gnosis"
documentation = "https://docs.rs/gnosis"
rust-version = "1.85"
description = "Gnosis — enterprise knowledge compiler (CLI + library)"
readme = "README.md"
keywords = ["knowledge", "compiler", "okf", "tree-sitter", "tui"]
categories = ["command-line-utilities", "development-tools"]
default-run = "gnosis"

[lib]
name = "gnosis"
path = "src/lib.rs"

[[bin]]
name = "gnosis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# Omit aws-sdk-s3's default `rustls` feature — it enables legacy rustls 0.21
# (RUSTSEC-2026-0098/0099/0104). Modern TLS comes from `default-https-client`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
csv = "1"
ignore = "0.4"
mime_guess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-rust = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2"
crossbeam-channel = "0.5"
predicates = "3"
tempfile = "3"

# cargo-deny configuration for Gnosis.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # zip 6.0.0. The patched line is zip >= 9, which declares rust-version 1.88.
    # These three advisories are ZipArchive::extract and ZipStreamReader::extract.
    # Office packages are read into memory with by_index; extract is not called.
    { id = "RUSTSEC-2026-0367", reason = "extract() is unused; zip 9 needs Rust 1.88" },
    { id = "RUSTSEC-2026-0368", reason = "extract() is unused; zip 9 needs Rust 1.88" },
    { id = "RUSTSEC-2026-0369", reason = "extract() is unused; zip 9 needs Rust 1.88" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "LGPL-2.1-or-later",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
